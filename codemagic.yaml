
workflows:
  ios-vico-hub:
    name: Vico Hub - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: com.vico1513.vicohub
      node: 22
      xcode: latest

    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Compilar aplicação web
        script: npm run build

      - name: Sincronizar Capacitor
        script: npx cap sync ios

      - name: Compilar e gerar IPA
        script: |
          set -e

          xcodebuild \
            -project "ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/VicoHub.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"

          cp -R "$CM_BUILD_DIR/build/VicoHub.xcarchive/Products/Applications/App.app" \
            "$CM_BUILD_DIR/build/ipa/Payload/"

          cd "$CM_BUILD_DIR/build/ipa"

          zip -r "$CM_BUILD_DIR/build/VicoHub.ipa" Payload

    artifacts:
      - build/VicoHub.ipa
      - build/VicoHub.xcarchive/**
      - /tmp/xcodebuild_logs/*.log
