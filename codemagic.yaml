workflows:
  ios-vico-hub:
    name: Vico Hub - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: com.vico1513.vicohub
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
      node: 22
      xcode: latest

    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Compilar aplicação web
        script: npm run build

      - name: Sincronizar Capacitor
        script: npx cap sync ios

      - name: Compilar projeto iOS
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/VicoHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - build/VicoHub.xcarchive
