
workflows:
  ios-vico-hub:
    name: Vico Hub - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: com.vico1513.vicohub
      node: 22
      xcode: latest

    scripts:
      - name: Instalar dependências
        script: npm install

      - name: Compilar aplicação web
        script: npm run build

      - name: Sincronizar Capacitor
        script: npx cap sync ios

      - name: Compilar projeto iOS
        script: |
          xcodebuild -project "ios/App/App.xcodeproj" -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$CM_BUILD_DIR/build/VicoHub.xcarchive" CODE_SIGNING_ALLOWED=NO archive

    artifacts:
      - build/VicoHub.xcarchive/**
      - build/VicoHub.xcarchive/Products/Applications/*.app
      - /tmp/xcodebuild_logs/*.log
